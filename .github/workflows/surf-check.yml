name: Surf Check
on:
  schedule:
    - cron: '0 10 * * 2'
    - cron: '0 10 * * 4'
    - cron: '0 10 * * 6'
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Envoyer un e-mail de test avec des données simulées"
        required: false
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Exécuter la vérification des conditions de surf
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: '587'
          TEST_MODE: ${{ inputs.test_mode == true }}
        run: python surf_check.py
