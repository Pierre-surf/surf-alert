name: Surf Check

# Déclencheurs :
#  - schedule : trois créneaux hebdomadaires à midi (heure de Paris, soit
#    10h UTC pendant la saison mi-mai à fin octobre, toujours en heure
#    d'été CEST = UTC+2 sur cette période) :
#      * mardi   : le script vérifie si c'est l'avant-veille du jeudi de
#                  l'Ascension cette année ; sinon il ne fait rien.
#      * jeudi   : vérification hebdomadaire habituelle (week-end à venir
#                  + jours fériés fixes 14 juillet / 15 août si proches).
#      * samedi  : le script vérifie si c'est l'avant-veille du lundi de
#                  Pentecôte cette année ; sinon il ne fait rien.
#    Le script lui-même (surf_check.py) décide quoi faire selon le jour
#    d'exécution ; ces trois cron déclenchent le même job, sans distinction
#    de paramètres.
#  - workflow_dispatch : permet un déclenchement manuel depuis l'onglet
#    "Actions" du dépôt, utile pour tester sans attendre l'un des trois
#    jours. L'option "test_mode" (décochée par défaut) permet de lancer un
#    envoi d'e-mail de test avec des données simulées, sans appeler les
#    API.
on:
  schedule:
    - cron: '0 10 * * 2'   # mardi 12h Paris (CEST) — avant-veille Ascension
    - cron: '0 10 * * 4'   # jeudi 12h Paris (CEST) — vérification hebdomadaire
    - cron: '0 10 * * 6'   # samedi 12h Paris (CEST) — avant-veille Pentecôte
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Envoyer un e-mail de test avec des données simulées"
        required: false
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Exécuter la vérification des conditions de surf
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          # Valeurs par défaut adaptées à Gmail (port 587, STARTTLS).
          # À adapter si une autre messagerie est utilisée.
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: '587'
          # Activé uniquement si la case "test_mode" est cochée lors d'un
          # déclenchement manuel ; toujours "false" sur les exécutions
          # planifiées, qui n'ont pas cet input.
          TEST_MODE: ${{ inputs.test_mode == true }}
        run: python surf_check.py
